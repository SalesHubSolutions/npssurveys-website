<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A six-step loop: service happens, a short survey, the answer on the record, low scores routed, monthly review, redesign and measure again"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker></defs><rect width="1000" height="520" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">The service measurement loop</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Measure every redesign at the moment of service, then fix what the scores show.</text><circle cx="500" cy="295" r="170" fill="none" stroke="#DCE7FF" stroke-width="12"/><rect x="375.0" y="91.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="2"/><circle cx="399.0" cy="125.0" r="14" fill="#0C184A"/><text x="399.0" y="130.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="421.0" y="121.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Service happens</text><text x="421.0" y="142.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">application, call, visit</text><rect x="592.2243186433545" y="176.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="2"/><circle cx="616.2243186433545" cy="210.0" r="14" fill="#0C184A"/><text x="616.2243186433545" y="215.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="638.2243186433545" y="206.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Short survey</text><text x="638.2243186433545" y="227.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">CSAT or effort, 1–3 questions</text><rect x="592.2243186433545" y="346.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="2"/><circle cx="616.2243186433545" cy="380.0" r="14" fill="#0C184A"/><text x="616.2243186433545" y="385.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="638.2243186433545" y="376.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Answer on record</text><text x="638.2243186433545" y="397.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">case and contact in Salesforce</text><rect x="375.0" y="431.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2"/><circle cx="399.0" cy="465.0" r="14" fill="#0C184A"/><text x="399.0" y="470.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="421.0" y="461.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Low score routed</text><text x="421.0" y="482.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">owner and due date</text><rect x="157.7756813566454" y="346.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="2"/><circle cx="181.7756813566454" cy="380.0" r="14" fill="#0C184A"/><text x="181.7756813566454" y="385.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">5</text><text x="203.7756813566454" y="376.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Monthly review</text><text x="203.7756813566454" y="397.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">theme comments by cause</text><rect x="157.77568135664546" y="176.0" width="250" height="68" rx="14" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="2"/><circle cx="181.77568135664546" cy="210.0" r="14" fill="#0C184A"/><text x="181.77568135664546" y="215.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">6</text><text x="203.77568135664546" y="206.0" font-size="15" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Redesign</text><text x="203.77568135664546" y="227.0" font-size="12" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">then measure again</text><circle cx="500" cy="295" r="92" fill="#0C184A"/><text x="500" y="283" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">Did it work</text><text x="500" y="303" font-size="15" font-weight="800" fill="#FFE443" text-anchor="middle" font-family="Inter, Arial, sans-serif">for the people</text><text x="500" y="323" font-size="15" font-weight="800" fill="#FFE443" text-anchor="middle" font-family="Inter, Arial, sans-serif">we serve?</text></svg>