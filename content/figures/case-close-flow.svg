<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Five steps: a case closes, the survey sends once to the case contact, the customer rates the interaction, the answer is saved on the Case and Contact, and a low score goes to an owner for follow-up"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">CSAT on case close: the whole loop in Salesforce</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">One trigger, one survey per case, every answer on the record</text><rect x="40.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0C184A"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Case closes</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Status moves to a</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">closed value you</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">chose</text><line x1="198.0" y1="200" x2="228.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="232.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="262.0" cy="142" r="16" fill="#0C184A"/><text x="262.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="252.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Survey sends</text><text x="252.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Once, to the case</text><text x="252.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">contact, after a</text><text x="252.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">short delay</text><line x1="390.0" y1="200" x2="420.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="424.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="454.0" cy="142" r="16" fill="#0C184A"/><text x="454.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="444.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">They rate it</text><text x="444.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">One CSAT question</text><text x="444.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">and one optional</text><text x="444.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">"why" question</text><line x1="582.0" y1="200" x2="612.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="616.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="646.0" cy="142" r="16" fill="#0C184A"/><text x="646.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="636.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Answer saved</text><text x="636.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">On the Case and</text><text x="636.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Contact, ready for</text><text x="636.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">reports</text><line x1="774.0" y1="200" x2="804.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="808.0" y="110" width="152.0" height="180" rx="16" fill="#EAF1FF" stroke="#1E54E8" stroke-width="2.5"/><circle cx="838.0" cy="142" r="16" fill="#1E54E8"/><text x="838.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">5</text><text x="828.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Owner acts</text><text x="828.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">A low score goes</text><text x="828.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">to an owner who</text><text x="828.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">follows up</text></svg>