<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Five steps to work a detractor case: pick it up, read the score and comment on the record, reach out within one business day, fix or explain, record what you did and close the case"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Working a detractor (P1) case</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">The daily routine for service managers and case owners</text><rect x="40.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0C184A"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Pick it up</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Open the P1 case</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">from your queue</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">or list view</text><line x1="198.0" y1="200" x2="228.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="232.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="262.0" cy="142" r="16" fill="#0C184A"/><text x="262.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="252.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Read first</text><text x="252.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Score, comment</text><text x="252.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">and history on</text><text x="252.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">the record</text><line x1="390.0" y1="200" x2="420.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="424.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="454.0" cy="142" r="16" fill="#0C184A"/><text x="454.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="444.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Reach out</text><text x="444.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Call or email</text><text x="444.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">within one</text><text x="444.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">business day</text><line x1="582.0" y1="200" x2="612.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="616.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="646.0" cy="142" r="16" fill="#0C184A"/><text x="646.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="636.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Fix it</text><text x="636.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Solve or explain,</text><text x="636.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">and agree the</text><text x="636.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">next step</text><line x1="774.0" y1="200" x2="804.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="808.0" y="110" width="152.0" height="180" rx="16" fill="#EAF1FF" stroke="#1E54E8" stroke-width="2.5"/><circle cx="838.0" cy="142" r="16" fill="#1E54E8"/><text x="838.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">5</text><text x="828.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Close loop</text><text x="828.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Record what you</text><text x="828.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">did, then close</text><text x="828.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">the case</text></svg>