<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Live mode versus Snapshot mode after the limit is raised from 1 to 3. Live: events A, B and C can all get up to 3 reminders. Snapshot: event A keeps 1, event B keeps 2, event C gets 3."><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="430" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Live or Snapshot mode: what happens when you change the limit</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Example: the reminder limit is raised from 1 to 3. Filled dots are the reminders each pending event can get in total.</text><rect x="40" y="104" width="450" height="290" rx="16" fill="#FFFFFF" stroke="#002FA7" stroke-width="2"/><text x="64" y="140" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Live mode</text><text x="64" y="164" font-size="14" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Every pending event follows today's limit</text><text x="64" y="206" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event A</text><text x="64" y="227" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent when the limit was 1</text><circle cx="356" cy="210" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="394" cy="210" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="432" cy="210" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><text x="64" y="268" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event B</text><text x="64" y="289" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent when the limit was 2</text><circle cx="356" cy="272" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="394" cy="272" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="432" cy="272" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><text x="64" y="330" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event C</text><text x="64" y="351" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent after it became 3</text><circle cx="356" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="394" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="432" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><rect x="510" y="104" width="450" height="290" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="534" y="140" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Snapshot mode</text><text x="534" y="164" font-size="14" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Each event keeps the limit it started with</text><text x="534" y="206" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event A</text><text x="534" y="227" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent when the limit was 1</text><circle cx="826" cy="210" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="864" cy="210" r="13" fill="#FFFFFF" stroke="#002FA7" stroke-width="2"/><circle cx="902" cy="210" r="13" fill="#FFFFFF" stroke="#002FA7" stroke-width="2"/><text x="534" y="268" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event B</text><text x="534" y="289" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent when the limit was 2</text><circle cx="826" cy="272" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="864" cy="272" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="902" cy="272" r="13" fill="#FFFFFF" stroke="#002FA7" stroke-width="2"/><text x="534" y="330" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Event C</text><text x="534" y="351" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">sent after it became 3</text><circle cx="826" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="864" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/><circle cx="902" cy="334" r="13" fill="#002FA7" stroke="#002FA7" stroke-width="2"/></svg>