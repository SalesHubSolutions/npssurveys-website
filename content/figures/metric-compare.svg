<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="Comparison of NPS, CSAT and CES: the question each asks, the scale, how the score is calculated, what it measures and the best moment to send it"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="580" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">NPS, CSAT and CES side by side</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Three questions, three jobs. Pick the one that matches the moment.</text><rect x="40" y="100" width="296" height="450" rx="16" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2"/><rect x="40" y="100" width="296" height="62" rx="16" fill="#1E54E8" stroke="#1E54E8" stroke-width="1.5"/><rect x="40" y="140" width="296" height="22" fill="#1E54E8"/><text x="60" y="140" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start" font-family="Inter, Arial, sans-serif">NPS</text><text x="316" y="138" font-size="12" font-weight="800" fill="#FFE443" text-anchor="end" font-family="Inter, Arial, sans-serif">RELATIONSHIP</text><text x="60" y="186" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">QUESTION</text><text x="60" y="206" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">"How likely are you to</text><text x="60" y="224" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">recommend us to a friend</text><text x="60" y="242" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">or colleague?"</text><text x="60" y="274" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCALE</text><text x="60" y="294" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">0 to 10</text><text x="60" y="326" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCORE</text><text x="60" y="346" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">% promoters (9-10)</text><text x="60" y="364" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">minus % detractors (0-6)</text><text x="60" y="396" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">MEASURES</text><text x="60" y="416" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Loyalty to the whole</text><text x="60" y="434" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">relationship</text><text x="60" y="466" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">BEST MOMENT</text><text x="60" y="486" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Every 6-12 months, or</text><text x="60" y="504" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">after a big milestone</text><rect x="352" y="100" width="296" height="450" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><rect x="352" y="100" width="296" height="62" rx="16" fill="#0C184A" stroke="#0C184A" stroke-width="1.5"/><rect x="352" y="140" width="296" height="22" fill="#0C184A"/><text x="372" y="140" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start" font-family="Inter, Arial, sans-serif">CSAT</text><text x="628" y="138" font-size="12" font-weight="800" fill="#FFE443" text-anchor="end" font-family="Inter, Arial, sans-serif">ONE INTERACTION</text><text x="372" y="186" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">QUESTION</text><text x="372" y="206" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">"How satisfied are you</text><text x="372" y="224" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">with how we handled</text><text x="372" y="242" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">your request?"</text><text x="372" y="274" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCALE</text><text x="372" y="294" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Often 1 to 5</text><text x="372" y="326" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCORE</text><text x="372" y="346" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Satisfied answers (4-5)</text><text x="372" y="364" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">÷ all answers, as a %</text><text x="372" y="396" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">MEASURES</text><text x="372" y="416" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">How one interaction</text><text x="372" y="434" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">went</text><text x="372" y="466" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">BEST MOMENT</text><text x="372" y="486" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Right after the moment:</text><text x="372" y="504" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">a case closes, a deal ends</text><rect x="664" y="100" width="296" height="450" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><rect x="664" y="100" width="296" height="62" rx="16" fill="#0C184A" stroke="#0C184A" stroke-width="1.5"/><rect x="664" y="140" width="296" height="22" fill="#0C184A"/><text x="684" y="140" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start" font-family="Inter, Arial, sans-serif">CES</text><text x="940" y="138" font-size="12" font-weight="800" fill="#FFE443" text-anchor="end" font-family="Inter, Arial, sans-serif">EFFORT</text><text x="684" y="186" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">QUESTION</text><text x="684" y="206" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">"How easy was it to</text><text x="684" y="224" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">get what you needed</text><text x="684" y="242" font-size="13.5" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">today?"</text><text x="684" y="274" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCALE</text><text x="684" y="294" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Often 1 to 5 or 1 to 7</text><text x="684" y="326" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">SCORE</text><text x="684" y="346" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Average score, or the</text><text x="684" y="364" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">share of easy answers</text><text x="684" y="396" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">MEASURES</text><text x="684" y="416" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">How much work the</text><text x="684" y="434" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">customer had to do</text><text x="684" y="466" font-size="11" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">BEST MOMENT</text><text x="684" y="486" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">After a task: a form,</text><text x="684" y="504" font-size="13.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">a portal step, onboarding</text></svg>