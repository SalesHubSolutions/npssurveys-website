<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Five moments in one customer journey and the measure for each: deal won uses CSAT, onboarding complete uses CES, case closed uses CSAT, a portal task uses CES, and a relationship check twice a year uses NPS"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">One customer, five moments, the right measure for each</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Each survey is sent by a Salesforce event and lands on that record</text><rect x="40.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0C184A"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Deal won</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Opportunity is</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Closed Won: ask</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">about buying</text><text x="174.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">CSAT</text><line x1="198.0" y1="200" x2="228.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="232.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="262.0" cy="142" r="16" fill="#0C184A"/><text x="262.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="252.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Onboarded</text><text x="252.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Onboarding is</text><text x="252.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">done: ask how</text><text x="252.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">easy setup was</text><text x="366.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">CES</text><line x1="390.0" y1="200" x2="420.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="424.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="454.0" cy="142" r="16" fill="#0C184A"/><text x="454.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="444.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Case closed</text><text x="444.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Case moves to</text><text x="444.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">closed: ask about</text><text x="444.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">that one request</text><text x="558.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">CSAT</text><line x1="582.0" y1="200" x2="612.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="616.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="646.0" cy="142" r="16" fill="#0C184A"/><text x="646.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="636.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Portal task</text><text x="636.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Form or request</text><text x="636.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">submitted: ask how</text><text x="636.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">easy it was</text><text x="750.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">CES</text><line x1="774.0" y1="200" x2="804.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="808.0" y="110" width="152.0" height="180" rx="16" fill="#EAF1FF" stroke="#1E54E8" stroke-width="2.5"/><circle cx="838.0" cy="142" r="16" fill="#1E54E8"/><text x="838.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">5</text><text x="828.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Twice a year</text><text x="828.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Relationship</text><text x="828.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">check on the</text><text x="828.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Account</text><text x="942.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">NPS</text></svg>