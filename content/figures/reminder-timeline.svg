<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Reminder timeline with a limit of 2: initial survey on day 0, reminder 1 only if no answer after 24 hours, reminder 2 only if still no answer 24 hours later, then stop. Any answer stops reminders."><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="420" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">How reminders go out: only to people who haven't answered</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Example with a reminder limit of 2. Each step waits 24 hours for an answer.</text><rect x="40.0" y="108" width="197.0" height="176" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="60.0" y="140" font-size="12" font-weight="800" fill="#002FA7" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">DAY 0</text><text x="60.0" y="172" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Initial survey</text><text x="60.0" y="202" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Sent when the record</text><text x="60.0" y="223" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">qualifies, instantly</text><text x="60.0" y="244" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">or on a schedule</text><line x1="243.0" y1="196" x2="277.0" y2="196" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="281.0" y="108" width="197.0" height="176" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="301.0" y="140" font-size="12" font-weight="800" fill="#002FA7" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">DAY 1+</text><text x="301.0" y="172" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Reminder 1</text><text x="301.0" y="202" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Only if no answer</text><text x="301.0" y="223" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">24 hours after</text><text x="301.0" y="244" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">the survey</text><line x1="484.0" y1="196" x2="518.0" y2="196" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="522.0" y="108" width="197.0" height="176" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="542.0" y="140" font-size="12" font-weight="800" fill="#002FA7" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">DAY 2+</text><text x="542.0" y="172" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Reminder 2</text><text x="542.0" y="202" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Only if still no</text><text x="542.0" y="223" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">answer 24 hours</text><text x="542.0" y="244" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">after Reminder 1</text><line x1="725.0" y1="196" x2="759.0" y2="196" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="763.0" y="108" width="197.0" height="176" rx="16" fill="#EAF1FF" stroke="#002FA7" stroke-width="2.5"/><text x="783.0" y="140" font-size="12" font-weight="800" fill="#002FA7" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">THEN</text><text x="783.0" y="172" font-size="19" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Stop</text><text x="783.0" y="202" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Limit reached:</text><text x="783.0" y="223" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">no more emails</text><text x="783.0" y="244" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">for this survey</text><rect x="40" y="312" width="920" height="72" rx="16" fill="#FFFFFF" stroke="#23A96A" stroke-width="2"/><circle cx="78" cy="348" r="16" fill="#23A96A"/><path d="M70 348 l6 6 l11 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="343" font-size="16" font-weight="700" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Answered at any point? Reminders stop for that person and that survey.</text><text x="108" y="366" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Reminder subjects are numbered automatically, for example “Reminder 1 - [your subject]”.</text></svg>