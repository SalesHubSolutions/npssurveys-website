<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Automation and reminders: Choose the Salesforce event and the filters; Send instantly or on a schedule; Reminders go only to people who haven't answered, 24 hours apart, up to your limit; See every trigger and switch it on or off in one panel"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Surveys that send themselves, with reminders.</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Automation and reminders in NPS Survey CX OS</text><rect x="40.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0C184A"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Event</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">A Salesforce record</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">matches your</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">filters</text><line x1="246.0" y1="200" x2="276.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="280.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="310.0" cy="142" r="16" fill="#0C184A"/><text x="310.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="300.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Send</text><text x="300.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Instantly or on</text><text x="300.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">the schedule</text><text x="300.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">you choose</text><line x1="486.0" y1="200" x2="516.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="520.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="550.0" cy="142" r="16" fill="#0C184A"/><text x="550.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="540.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Wait 24h</text><text x="540.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">No answer yet?</text><text x="540.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">A reminder goes</text><text x="540.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">out</text><line x1="726.0" y1="200" x2="756.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="760.0" y="110" width="200.0" height="180" rx="16" fill="#EAF1FF" stroke="#002FA7" stroke-width="2.5"/><circle cx="790.0" cy="142" r="16" fill="#002FA7"/><text x="790.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="780.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Stop</text><text x="780.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Reminders stop</text><text x="780.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">once they answer</text><text x="780.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">or hit your limit</text></svg>