<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Comparison: a bolt-on survey tool keeps responses in a vendor cloud synced by a connector; a native app keeps the whole loop inside Salesforce"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker></defs><rect width="1000" height="420" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Bolt-on survey tool vs. native app</text><rect x="40" y="80" width="450" height="310" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="64" y="114" font-size="13" font-weight="800" fill="#EB5757" text-anchor="start" font-family="Inter, Arial, sans-serif">BOLT-ON</text><text x="64" y="138" font-size="16" font-weight="700" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Data lives in two places</text><rect x="70" y="170" width="170" height="80" rx="12" fill="#F4F7FF" stroke="#DCE4F7" stroke-width="1.5"/><text x="155" y="205" font-size="16" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Salesforce</text><text x="155" y="228" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">records</text><rect x="300" y="170" width="160" height="80" rx="12" fill="#FFF4DB" stroke="#E9A52B" stroke-width="1.5"/><text x="380" y="205" font-size="16" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Vendor cloud</text><text x="380" y="228" font-size="13" font-weight="500" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">responses</text><line x1="244" y1="195" x2="296" y2="195" stroke="#E9A52B" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 7"/><line x1="296" y1="225" x2="244" y2="225" stroke="#E9A52B" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 7"/><text x="270" y="272" font-size="13" font-weight="700" fill="#E9A52B" text-anchor="middle" font-family="Inter, Arial, sans-serif">connector + field mapping</text><text x="74" y="316" font-size="14" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">✕  New vendor security review</text><text x="74" y="340" font-size="14" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">✕  Sync errors and duplicates</text><text x="74" y="364" font-size="14" font-weight="600" fill="#3B4877" text-anchor="start" font-family="Inter, Arial, sans-serif">✕  Low scores noticed late</text><rect x="510" y="80" width="450" height="310" rx="16" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><text x="534" y="114" font-size="13" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">NATIVE (NPS SURVEY CX OS)</text><text x="534" y="138" font-size="16" font-weight="700" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Everything on the record</text><rect x="530" y="160" width="410" height="120" rx="14" fill="#EAF1FF" stroke="#1E54E8" stroke-width="1.5"/><text x="546" y="182" font-size="12" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">Inside your Salesforce org</text><rect x="546" y="196" width="86" height="68" rx="10" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="589" y="224" font-size="13" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Event</text><text x="589" y="244" font-size="11" font-weight="600" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">sends survey</text><line x1="632" y1="230" x2="642" y2="230" stroke="#1E54E8" stroke-width="3" marker-end="url(#ah)"/><rect x="644" y="196" width="86" height="68" rx="10" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="687" y="224" font-size="13" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Answer</text><text x="687" y="244" font-size="11" font-weight="600" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">on record</text><line x1="730" y1="230" x2="740" y2="230" stroke="#1E54E8" stroke-width="3" marker-end="url(#ah)"/><rect x="742" y="196" width="86" height="68" rx="10" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="785" y="224" font-size="13" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Low score</text><text x="785" y="244" font-size="11" font-weight="600" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">opens case</text><line x1="828" y1="230" x2="838" y2="230" stroke="#1E54E8" stroke-width="3" marker-end="url(#ah)"/><rect x="840" y="196" width="86" height="68" rx="10" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="883" y="224" font-size="13" font-weight="800" fill="#0C184A" text-anchor="middle" font-family="Inter, Arial, sans-serif">Dashboard</text><text x="883" y="244" font-size="11" font-weight="600" fill="#5E6B98" text-anchor="middle" font-family="Inter, Arial, sans-serif">CX360</text><text x="544" y="316" font-size="14" font-weight="700" fill="#23A96A" text-anchor="start" font-family="Inter, Arial, sans-serif">✓  Data never leaves Salesforce</text><text x="544" y="340" font-size="14" font-weight="700" fill="#23A96A" text-anchor="start" font-family="Inter, Arial, sans-serif">✓  No connector to maintain</text><text x="544" y="364" font-size="14" font-weight="700" fill="#23A96A" text-anchor="start" font-family="Inter, Arial, sans-serif">✓  Every detractor gets an owner</text></svg>