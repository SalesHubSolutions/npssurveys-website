<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Go-live checklist. Before you build: list closed statuses, pick record types and queues, exclude spam and internal cases, agree who owns a low score. Test in a sandbox: one survey per closed case, no second survey on edit, score shows on the Case, low score notifies the owner"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="470" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Go-live checklist: CSAT on case close</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Run it in a sandbox first, then repeat in production</text><rect x="40" y="104" width="450" height="330" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><text x="64" y="140" font-size="13" font-weight="800" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">BEFORE YOU BUILD</text><rect x="64" y="176" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M71 191 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="197" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">List every status that means closed</text><rect x="64" y="240" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M71 255 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="261" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Pick the record types and queues in scope</text><rect x="64" y="304" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M71 319 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="325" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Exclude spam, duplicates and internal cases</text><rect x="64" y="368" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M71 383 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="389" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Agree who owns a low score, and how fast</text><rect x="510" y="104" width="450" height="330" rx="16" fill="#EAF1FF" stroke="#1E54E8" stroke-width="2.5"/><text x="534" y="140" font-size="13" font-weight="800" fill="#1E54E8" text-anchor="start" font-family="Inter, Arial, sans-serif">TEST IN A SANDBOX</text><rect x="534" y="176" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M541 191 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="197" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Close a test case: one survey arrives</text><rect x="534" y="240" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M541 255 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="261" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Edit the closed case: no second survey</text><rect x="534" y="304" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M541 319 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="325" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Answer it: the score shows on the Case</text><rect x="534" y="368" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#1E54E8" stroke-width="2.5"/><path d="M541 383 l7 7 l12 -14" fill="none" stroke="#23A96A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="389" font-size="15.5" font-weight="600" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Give a low score: the owner is notified</text></svg>