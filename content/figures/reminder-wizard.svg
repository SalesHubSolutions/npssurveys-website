.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Check each</text><text x="828.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">section, then</text><text x="828.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">save</text></svg>