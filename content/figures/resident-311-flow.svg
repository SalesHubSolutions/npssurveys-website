<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Five steps: a 311 request closes, the survey sends once to the resident, the resident says whether it was resolved and why, the answer is saved on the case by service type and district, and a no or low score opens a follow-up case for the owning department"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#002FA7"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">311 feedback: from closed request to closed loop</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">One trigger per request, every answer on the case, every low score to the department</text><rect x="40.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0F1A3D"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Case closes</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">The 311 case</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">moves to a closed</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">status you chose</text><line x1="198.0" y1="200" x2="228.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="232.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="262.0" cy="142" r="16" fill="#0F1A3D"/><text x="262.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif">2</text><text x="252.0" y="196" font-size="18" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Survey sends</text><text x="252.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Once, to the</text><text x="252.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">resident who</text><text x="252.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">asked for help</text><line x1="390.0" y1="200" x2="420.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="424.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="454.0" cy="142" r="16" fill="#0F1A3D"/><text x="454.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif">3</text><text x="444.0" y="196" font-size="18" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">They answer</text><text x="444.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">"Was your request</text><text x="444.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">resolved?" plus one</text><text x="444.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">"why" question</text><line x1="582.0" y1="200" x2="612.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="616.0" y="110" width="152.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="646.0" cy="142" r="16" fill="#0F1A3D"/><text x="646.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif">4</text><text x="636.0" y="196" font-size="18" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Saved</text><text x="636.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">On the case, by</text><text x="636.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">service type and</text><text x="636.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">district</text><line x1="774.0" y1="200" x2="804.0" y2="200" stroke="#002FA7" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="808.0" y="110" width="152.0" height="180" rx="16" fill="#EAF1FF" stroke="#002FA7" stroke-width="2.5"/><circle cx="838.0" cy="142" r="16" fill="#002FA7"/><text x="838.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif">5</text><text x="828.0" y="196" font-size="18" font-weight="800" fill="#0F1A3D" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">Follow-up</text><text x="828.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">A "no" or low</text><text x="828.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">score opens a</text><text x="828.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="IBM Plex Sans, Arial, sans-serif">follow-up case</text></svg>