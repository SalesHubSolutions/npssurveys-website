<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Four steps: enter four inputs, see revenue at risk, see payback by plan, send a one-page business case to your CFO"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E54E8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E9A52B"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EB5757"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#23A96A"/></marker></defs><rect width="1000" height="330" rx="18" fill="#F4F7FF"/><text x="40" y="50" font-size="22" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">From four numbers to a CFO-ready business case</text><text x="40" y="78" font-size="15" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">The free ROI calculator at npssurveys.com/roi</text><rect x="40.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="70.0" cy="142" r="16" fill="#0C184A"/><text x="70.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">1</text><text x="60.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Enter 4 inputs</text><text x="60.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Accounts, revenue per</text><text x="60.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">account, churn rate,</text><text x="60.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">hours of manual work</text><line x1="246.0" y1="200" x2="276.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="280.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="310.0" cy="142" r="16" fill="#0C184A"/><text x="310.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">2</text><text x="300.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">See the risk</text><text x="300.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">Revenue at risk each</text><text x="300.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">year and hours spent</text><text x="300.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">on manual follow-up</text><line x1="486.0" y1="200" x2="516.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="520.0" y="110" width="200.0" height="180" rx="16" fill="#FFFFFF" stroke="#DCE4F7" stroke-width="1.5"/><circle cx="550.0" cy="142" r="16" fill="#0C184A"/><text x="550.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">3</text><text x="540.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">See payback</text><text x="540.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">How many saved</text><text x="540.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">accounts cover the</text><text x="540.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">plan you pick</text><line x1="726.0" y1="200" x2="756.0" y2="200" stroke="#1E54E8" stroke-width="2.5" marker-end="url(#ahs)"/><rect x="760.0" y="110" width="200.0" height="180" rx="16" fill="#EAF1FF" stroke="#1E54E8" stroke-width="2.5"/><circle cx="790.0" cy="142" r="16" fill="#1E54E8"/><text x="790.0" y="147" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Arial, sans-serif">4</text><text x="780.0" y="196" font-size="18" font-weight="800" fill="#0C184A" text-anchor="start" font-family="Inter, Arial, sans-serif">Send to your CFO</text><text x="780.0" y="224" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">A one-page business</text><text x="780.0" y="245" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">case, ready to print</text><text x="780.0" y="266" font-size="13.5" font-weight="500" fill="#5E6B98" text-anchor="start" font-family="Inter, Arial, sans-serif">or save as PDF</text><text x="942.0" y="147" font-size="14" font-weight="800" fill="#1E54E8" text-anchor="end" font-family="Inter, Arial, sans-serif">~60 seconds</text></svg>